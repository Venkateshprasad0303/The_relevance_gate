services:
  - type: web
    name: relevance-gate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "1"
      - key: CLICKHOUSE_HOST
        sync: false
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"
